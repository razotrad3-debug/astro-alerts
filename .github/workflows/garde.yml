name: garde-file

# Surveille la file du watcher et la debloque si un passage y reste coince.
# Voir garde.py pour le detail et l'incident du 24/09/2026 qui l'a motive.
#
# Workflow SEPARE et groupe de concurrence DISTINCT : c'est tout l'interet.
# Un passage coince dans le groupe du watcher ne peut pas bloquer le garde
# qui est justement la pour l'annuler.
#
# Deux declencheurs :
#  - la fin de chaque passage du watcher qui N'A PAS reussi (annule, echoue).
#    C'est le signe meme d'une panne, et il reagit dans la minute. Mesure le
#    08/10/2026 : son cron seul etait tombe a un passage toutes les 4 a 7 h,
#    GitHub bridant les crons frequents — la garantie de "20 min au pire" ne
#    tenait plus. Quand le watcher reussit, le job est saute : aucun cout.
#  - le cron, en filet de securite pour le cas ou plus rien ne tourne du tout
#    (minuteur mort) et ou il n'y a donc plus de fin de passage a observer.

on:
  workflow_run:
    workflows: ["x-short-watcher"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write      # annuler un passage coince
  contents: read

concurrency:
  group: garde-file
  cancel-in-progress: true

jobs:
  garde:
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: garde.py
          sparse-checkout-cone-mode: false

      - name: Debloquer la file si besoin
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 garde.py
