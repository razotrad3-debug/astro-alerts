name: x-short-watcher

on:
  schedule:
    # Toutes les 15 minutes. Le minimum autorise par GitHub est 5 min, mais
    # le declenchement part deja avec 5 a 15 min de retard aux heures
    # chargees : passer a 5 min ne gagnerait presque rien sur la latence
    # reelle, et triplerait la facture twitterapi.io (facturee au tweet
    # ramene, ~20 par appel). Voir la section Cout du README.
    - cron: "*/5 * * * *"
  # Declenchement par evenement : contrairement au cron, il n'est pas bride
  # par GitHub et demarre en quelques secondes. Un minuteur externe gratuit
  # (Cloudflare Workers, cron-job.org) poste ici chaque minute.
  repository_dispatch:
    types: [verifier]

  workflow_dispatch:        # bouton "Run workflow" pour tester a la main
    inputs:
      entrees:
        description: "Renvoyer les N dernieres entrees (0 = passage normal)"
        default: "0"
      inspecter:
        description: "Afficher la forme brute des tweets (true/false)"
        default: "false"

# Necessaire pour que le job puisse recommiter state.json (la memoire du bot).
permissions:
  contents: write

concurrency:
  # Deux passages simultanes se marcheraient dessus sur state.json.
  group: x-short-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # GARDE-FOU ANTI-CHEVAUCHEMENT.
      # `concurrency` ci-dessus ne suffit pas : mesure le 16/09/2026, deux
      # passages ont tourne ensemble (02:06:56-02:08:45 et 02:08:17-02:10:40).
      # Le second a lu le state.json d'AVANT l'ecriture du premier, a donc cru
      # le tweet nouveau et a envoye une deuxieme alerte identique, puis a
      # echoue en poussant par-dessus. Aucune dedup applicative ne peut
      # rattraper ca : les deux processus lisent la meme memoire perimee.
      #
      # On tranche par l'identifiant de passage : le plus ancien garde la
      # main, les autres s'effacent. Deterministe, donc pas de nouvelle course.
      - name: Un seul passage a la fois
        id: garde
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encours=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?status=in_progress&per_page=100" \
            | jq -r --arg self "$GITHUB_RUN_ID" --arg wf "$GITHUB_WORKFLOW" \
              '.workflow_runs[] | select(.name == $wf)
                                | select((.id|tostring) != $self) | .id')

          for id in $encours; do
            if [ "$id" -lt "$GITHUB_RUN_ID" ]; then
              echo "Passage $id deja en cours et plus ancien : on lui laisse la main."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Aucun passage plus ancien en cours : on continue."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.garde.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.garde.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.garde.outputs.skip != 'true'

      - name: Passage du watcher
        if: steps.garde.outputs.skip != 'true'
        env:
          # En Secret (masque dans les logs) de preference ; en Variable si
          # tu te fiches que le handle apparaisse en clair.
          X_HANDLES: ${{ secrets.X_HANDLES || vars.X_HANDLES }}
          # Mode gratuit (defaut)
          SOURCE_X: ${{ vars.SOURCE_X || 'telegram' }}
          TELEGRAM_CANAL: ${{ vars.TELEGRAM_CANAL || 'AstronomerZero' }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FOURNISSEUR_IA: ${{ vars.FOURNISSEUR_IA || 'gemini' }}
          # Comportement : sans photo, ce n'est pas une annonce d'entree.
          ANALYSER_SANS_IMAGE: ${{ vars.ANALYSER_SANS_IMAGE || 'false' }}
          STATUTS_ALERTE: ${{ vars.STATUTS_ALERTE || 'ouverture,intention' }}
          # Jamais d'alerte sur un post plus vieux que ca, quoi qu'en dise
          # la memoire : c'est le garde-fou contre le rejeu d'historique.
          AGE_MAX_HEURES: ${{ vars.AGE_MAX_HEURES || '6' }}
          ALERTER_SANS_TRADE: ${{ vars.ALERTER_SANS_TRADE || 'false' }}
          # Le runner tourne en UTC : sans ca, l'heure affichee dans les
          # alertes a deux heures de retard sur celle du telephone.
          FUSEAU: ${{ vars.FUSEAU || 'Europe/Paris' }}
          STOP_ESTIME_PCT: ${{ vars.STOP_ESTIME_PCT || '0.9' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Mode payant : bascule via les Variables SOURCE_X / FOURNISSEUR_IA
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.inspecter }}" = "true" ]; then
            python main.py --inspecter
          elif [ "${{ github.event.inputs.entrees }}" != "" ] && [ "${{ github.event.inputs.entrees }}" != "0" ]; then
            python main.py --entrees "${{ github.event.inputs.entrees }}"
          else
            # Passage unique (~1 min). Une boucle longue faisait deborder
            # les jobs les uns sur les autres avec les retards de GitHub, et
            # le groupe de concurrence annulait les passages en attente :
            # quatre d'affilee perdus. Court et frequent est plus sur.
            python main.py
          fi

      - name: Memoriser les tweets traites
        if: steps.garde.outputs.skip != 'true'
        run: |
          # Battement quotidien : GitHub desactive TOUS les workflows
          # planifies d'un repo apres 60 jours sans activite. Un workflow
          # planifie ne peut donc pas se ranimer lui-meme. La parade est
          # de garantir au moins un commit par jour, quel que soit le
          # declencheur — meme quand le compte surveille ne poste rien.
          AUJOURDHUI=$(date -u +%F)
          if [ "$(cat battement.txt 2>/dev/null)" != "$AUJOURDHUI" ]; then
            echo "$AUJOURDHUI" > battement.txt
          fi

          if [ -z "$(git status --porcelain state.json battement.txt)" ]; then
            echo "Rien a memoriser."
            exit 0
          fi

          git config user.name  "astro-alerts"
          git config user.email "actions@github.com"

          # Le rebase seul ne suffisait pas : deux state.json divergents ne
          # se reconcilient pas tout seuls, le passage echouait et son
          # ecriture etait perdue — donc re-alerte au passage suivant. On
          # fusionne explicitement avec la version distante avant de
          # repousser, et on reessaie si quelqu'un nous grille au poteau.
          for essai in 1 2 3; do
            git add state.json battement.txt
            git commit -m "etat du watcher [skip ci]" || true

            if git push; then
              echo "Memoire ecrite (essai $essai)."
              exit 0
            fi

            echo "Pousse refusee : un autre passage a ecrit entre-temps, fusion."
            git fetch origin "${GITHUB_REF_NAME}"
            git show "origin/${GITHUB_REF_NAME}:state.json" > distant.json 2>/dev/null \
              || echo '{}' > distant.json
            git reset --soft "origin/${GITHUB_REF_NAME}"
            python fusion_etat.py state.json distant.json
            rm -f distant.json
          done

          echo "::warning::Memoire non ecrite apres 3 essais."
